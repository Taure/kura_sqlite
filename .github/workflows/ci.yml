name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

  # paths-ignore means a docs-only stretch produces no CI run at all, so a
  # dependency moving underneath a pin goes unnoticed. A weekly run catches
  # rot that no commit would have triggered.
  schedule:
    - cron: '35 5 * * 1'
  workflow_dispatch:
jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v2.0.5
    permissions:
      contents: write
      pull-requests: write
    with:
      version-file: '.tool-versions'
      enable-ct: false
      enable-ex-doc: true
      enable-hank: true
      enable-sheldon: false
      enable-audit: false
      enable-coverage: true
      enable-sbom: true
      enable-sbom-scan: true
      enable-dependency-submission: true
      enable-summary: true
      # Diff-scoped: only lines a PR changes are mutated, so this gates
      # new code without a retroactive sweep of every existing test.
      enable-mutate: true
      mutate-diff: true
      mutate-min-score: 75
      enable-elp-lint: true
      enable-elp-eqwalize: false
